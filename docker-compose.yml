name: gta-rp-population-graph

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in backend/.env}
      POSTGRES_USER: ${DB_USER:?Set DB_USER in backend/.env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in backend/.env}
    networks:
      gta-rp-dev:
        aliases:
          - postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gta_rp_population_graph"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  gta-rp-dev:
    external: true
    name: gta-rp-dev

volumes:
  postgres-data:
